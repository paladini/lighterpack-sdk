name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that reproduces it.
      render: typescript
    validations:
      required: false

  - type: dropdown
    id: instance
    attributes:
      label: LighterPack instance
      options:
        - lighterpack.com
        - Self-hosted (baseUrl)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: '@paladini/lighterpack version'
      description: From `npm ls @paladini/lighterpack`.
    validations:
      required: false

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: false
